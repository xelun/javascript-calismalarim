```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Operatörler</title>
</head>
<body>

    <script>

        // ━━━━━━━━━━━━━━━━━━━━
        // 💻 JAVASCRIPT OPERATÖRLER
        // ━━━━━━━━━━━━━━━━━━━━

        // 🔢 Matematiksel Operatörler

        console.log(10 + 10);
        // 20

        console.log(30 - 10);
        // 20

        console.log(10 * 2);
        // 20

        console.log(50 / 2);
        // 25


        // ━━━━━━━━━━━━━━━━━━━━
        // 📌 İşlem Önceliği
        // ━━━━━━━━━━━━━━━━━━━━

        console.log(10 + 20 * 2);
        // 50

        console.log((10 + 20) * 2);
        // 60


        // ━━━━━━━━━━━━━━━━━━━━
        // 🔼 ++
        // ━━━━━━━━━━━━━━━━━━━━

        var x = 10;

        x++;

        console.log(x);
        // 11


        // ━━━━━━━━━━━━━━━━━━━━
        // 🔽 --
        // ━━━━━━━━━━━━━━━━━━━━

        var y = 10;

        y--;

        console.log(y);
        // 9


        // ━━━━━━━━━━━━━━━━━━━━
        // ⚖️ Karşılaştırma Operatörleri
        // ━━━━━━━━━━━━━━━━━━━━

        console.log(20 > 10);
        // true

        console.log(5 < 10);
        // true

        console.log(10 >= 10);
        // true

        console.log(5 <= 10);
        // true

        console.log(10 == 10);
        // true

        console.log(10 === "10");
        // false

        console.log(10 != 5);
        // true


        // ━━━━━━━━━━━━━━━━━━━━
        // 🧠 Mantıksal Operatörler
        // ━━━━━━━━━━━━━━━━━━━━

        var yas = 20;
        var para = 200;

        // && VE

        console.log(yas > 18 && para > 100);
        // true


        // || VEYA

        console.log(yas > 30 || para > 100);
        // true


        // ! Tersine Çevirme

        console.log(!(10 > 5));
        // false

    </script>
    
</body>
</html>
```
